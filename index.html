<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --grid: #1f2937;
        --snake: #22c55e;
        --food: #f97316;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
      }

      .game-shell {
        width: min(92vw, 560px);
        background: color-mix(in srgb, var(--panel) 85%, black);
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 10px 40px rgb(0 0 0 / 40%);
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        gap: 12px;
      }

      .stats {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .stat {
        padding: 6px 10px;
        border-radius: 8px;
        background: #0b1220;
        border: 1px solid #273449;
        font-size: 0.95rem;
      }

      button {
        border: 1px solid #374151;
        background: #0b1220;
        color: var(--text);
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        border-color: #4b5563;
      }

      canvas {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 10px;
        border: 1px solid #334155;
        background: linear-gradient(180deg, #0b1120, #0a0f1a);
        display: block;
      }

      .hint {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <section class="hud">
        <div class="stats">
          <span class="stat">Score: <strong id="score">0</strong></span>
          <span class="stat">Best: <strong id="best">0</strong></span>
          <span class="stat">Speed: <strong id="speed">8</strong> fps</span>
        </div>
        <button id="restart" type="button">Restart</button>
      </section>

      <canvas id="board" width="500" height="500" aria-label="Snake game board"></canvas>
      <p class="hint">Use arrow keys or WASD to move. Eat food to grow. Avoid walls and yourself.</p>
    </main>

    <script>
      const GRID_SIZE = 20;
      const START_SPEED = 8;
      const MAX_SPEED = 16;
      const SPEED_STEP = 1;
      const STORAGE_KEY = 'snake-best-score';

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const speedEl = document.getElementById('speed');
      const restartButton = document.getElementById('restart');

      let snake;
      let direction;
      let queuedDirection;
      let food;
      let score;
      let best;
      let speed;
      let gameOver;
      let lastFrame = 0;

      const readBest = () => Number(localStorage.getItem(STORAGE_KEY)) || 0;
      const writeBest = (value) => localStorage.setItem(STORAGE_KEY, String(value));

      const randomCell = () => ({
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      });

      const spawnFood = () => {
        let next = randomCell();
        while (snake.some((part) => part.x === next.x && part.y === next.y)) {
          next = randomCell();
        }
        food = next;
      };

      const resetGame = () => {
        snake = [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        queuedDirection = direction;
        score = 0;
        speed = START_SPEED;
        gameOver = false;
        spawnFood();
        updateHud();
      };

      const updateHud = () => {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
        speedEl.textContent = String(speed);
      };

      const drawCell = (x, y, color, inset = 1) => {
        const size = canvas.width / GRID_SIZE;
        const px = x * size + inset;
        const py = y * size + inset;
        const psize = size - inset * 2;
        ctx.fillStyle = color;
        ctx.fillRect(px, py, psize, psize);
      };

      const drawGrid = () => {
        const size = canvas.width / GRID_SIZE;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
        ctx.lineWidth = 1;
        for (let i = 1; i < GRID_SIZE; i++) {
          const p = i * size;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      };

      const render = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGrid();

        drawCell(food.x, food.y, '#fb923c', 2);
        snake.forEach((segment, index) => {
          drawCell(segment.x, segment.y, index === 0 ? '#4ade80' : '#22c55e', 2);
        });

        if (gameOver) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#f8fafc';
          ctx.textAlign = 'center';
          ctx.font = 'bold 34px system-ui';
          ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 8);
          ctx.font = '18px system-ui';
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText('Press Restart or Space', canvas.width / 2, canvas.height / 2 + 28);
        }
      };

      const isReverse = (nextDirection) =>
        nextDirection.x === -direction.x && nextDirection.y === -direction.y;

      const tick = () => {
        if (gameOver) return;

        if (!isReverse(queuedDirection)) {
          direction = queuedDirection;
        }

        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };

        const hitWall = head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE;
        const hitSelf = snake.some((part) => part.x === head.x && part.y === head.y);

        if (hitWall || hitSelf) {
          gameOver = true;
          render();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 1;
          best = Math.max(best, score);
          writeBest(best);
          speed = Math.min(MAX_SPEED, START_SPEED + Math.floor(score / 3) * SPEED_STEP);
          spawnFood();
          updateHud();
        } else {
          snake.pop();
        }

        render();
      };

      const gameLoop = (timestamp) => {
        const interval = 1000 / speed;
        if (timestamp - lastFrame >= interval) {
          tick();
          lastFrame = timestamp;
        }
        requestAnimationFrame(gameLoop);
      };

      const keyToDirection = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 },
      };

      document.addEventListener('keydown', (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (key === ' ') {
          if (gameOver) {
            resetGame();
            render();
          }
          return;
        }

        const nextDirection = keyToDirection[key];
        if (nextDirection) {
          event.preventDefault();
          if (!isReverse(nextDirection)) {
            queuedDirection = nextDirection;
          }
        }
      });

      restartButton.addEventListener('click', () => {
        resetGame();
        render();
      });

      best = readBest();
      resetGame();
      render();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
